[package]
name = "cocoon"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A Telegram time-locked pastebin bot"
homepage = "https://github.com/serephus/cocoon"
repository = "https://github.com/serephus/cocoon"
readme = "README.md"
license-file = "LICENSE"
keywords = [
  "telegram",
  "pastebin",
  "time-lock",
  "self-hosted",
  "bot",
]
categories = [
  "web-programming::http-server",
]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.7", features = ["trace", "request-id"] }
teloxide = { version = "0.17", default-features = false, features = ["rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
diesel = { version = "2.3", features = ["sqlite", "r2d2"] }
diesel_migrations = { version = "2.3", features = ["sqlite"] }
# Link a bundled SQLite so no system sqlite/pkg-config is required.
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
sha2 = "0.11"
time = { version = "0.3", features = ["formatting", "parsing"] }
askama = "0.16"
percent-encoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
